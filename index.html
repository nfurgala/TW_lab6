<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorium 6 - Supabase</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-blue-600">Baza Artykułów</h1>

        <div class="mb-6 flex items-center gap-4 bg-white p-4 rounded shadow">
            <label for="sortSelect" class="font-bold">Sortuj według:</label>
            <select id="sortSelect" class="border border-gray-300 p-2 rounded">
                <option value="created_at.desc">Po dacie malejąco</option>
                <option value="created_at.asc">Po dacie rosnąco</option>
                <option value="title.asc">Po nazwie alfabetycznie</option>
            </select>
        </div>

        <div id="articlesContainer" class="flex flex-col gap-6 mb-12">
            <p class="text-gray-500">Ładowanie artykułów...</p>
        </div>

        <div class="bg-white p-6 rounded shadow border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold mb-4">Dodaj nowy artykuł</h2>
            <form id="addArticleForm" class="flex flex-col gap-4">
                
                <div class="flex gap-4">
                    <input type="text" id="title" placeholder="Tytuł (wymagany)" required class="border p-2 rounded flex-1" />
                    <input type="text" id="subtitle" placeholder="Podtytuł" class="border p-2 rounded flex-1" />
                </div>
                
                <div class="flex gap-4">
                    <input type="text" id="author" placeholder="Autor" class="border p-2 rounded flex-1" />
                    <input type="date" id="created_at" class="border p-2 rounded flex-1" title="Data utworzenia" />
                </div>

                <textarea id="content" placeholder="Treść artykułu..." class="border p-2 rounded"></textarea>
                
                <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                    Opublikuj artykuł
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
